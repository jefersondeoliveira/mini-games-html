<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treino de Lash Design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap">
<style>
/* layout: quiz de uma tela para celular deitado. Esquerda = a pergunta; direita = as respostas. O gabarito só aparece no fim. */
:root{
  color-scheme:dark;
  --bg:#14100E; --surface:#221A16; --raise:#2E241F; --line:#57483F;
  --text:#F6F0EA; --muted:#D2C4B9; --accent:#E7CABF; --good:#A6D8AE; --bad:#F2A892;
  --display:'Cormorant Garamond',Georgia,serif; --body:'Jost',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);flex:none}
header h1{font-family:var(--display);font-weight:600;font-size:20px;white-space:nowrap}
#dots{display:flex;gap:4px;flex:1;min-width:0}
#dots i{height:5px;flex:1;max-width:30px;border-radius:3px;background:var(--line)}
#dots i.done{background:var(--accent)}#dots i.now{background:var(--text)}
#count{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
#tip{display:none;background:var(--raise);color:var(--accent);padding:6px 16px;font-size:13px;flex:none}
main{flex:1;min-height:0;display:flex;gap:12px;padding:12px 16px}
#q{flex:1;min-width:0;background:var(--surface);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
#a{flex:1.1;min-width:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding-right:2px}
main.full #q{display:none}
@media (orientation:portrait){#tip{display:block}main{flex-direction:column}#q{flex:none;max-height:42%}}
.eye{font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h2{font-family:var(--display);font-weight:500;font-size:27px;line-height:1.12;text-wrap:balance}
h2 em{color:var(--accent)}
p{color:var(--muted)}
p b,li b{color:var(--text);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:var(--text);background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;text-align:left}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{border-color:var(--accent);background:#4A3830}
button.pri{background:var(--accent);color:#14100E;border-color:var(--accent);font-weight:500;text-align:center}
button:disabled{opacity:.4;cursor:default}
#a>*{flex:none}
.nav{display:flex;gap:8px;margin-top:auto;padding-top:6px;position:sticky;bottom:0;background:var(--bg)}
.nav button{flex:1;text-align:center}
.seq{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;border:1px dashed var(--line);border-radius:10px;padding:6px}
.seq:empty::before{content:'Toque nos passos abaixo, na ordem.';color:var(--muted);font-size:13px;padding:6px}
.big{font-family:var(--display);font-size:60px;font-weight:600;line-height:1;color:var(--accent)}
.res{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.res.ok{border-left-color:var(--good)}
.res .st{font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--bad)}
.res.ok .st{color:var(--good)}
.res b{font-weight:500}
.res span{color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
</style>
</head>
<body>
<header><h1>Treino de Lash</h1><div id="dots"></div><div id="count"></div></header>
<div id="tip">Vire o celular de lado para ter mais espaço.</div>
<main id="main"><section id="q"></section><section id="a"></section></main>
<script>
/* ===== BANCO DE PERGUNTAS: edite, tire ou acrescente à vontade ===== */
const R=['Atender normalmente','Atender com um cuidado extra','Não atender hoje'];
// [o que a cliente conta, índice da resposta certa em R, explicação]
const CASOS=[
 ['“Meu olho está vermelho, com secreção, e acordou grudado.”',2,'Sinais de conjuntivite. Não aplique e oriente a procurar um oftalmologista. Volte só depois de curada.'],
 ['“Tenho umas casquinhas na raiz dos cílios e coça bastante.”',2,'Pode ser blefarite, uma inflamação na borda da pálpebra. Extensão dificulta a limpeza e piora o quadro. Só com o problema tratado.'],
 ['“Apareceu um terçol na pálpebra de cima anteontem.”',2,'Terçol é uma infecção ativa. Espere sarar por completo antes de aplicar.'],
 ['“Da última vez, em outro lugar, meu olho inchou muito por causa da cola.”',2,'Histórico de reação ao adesivo. Não aplique hoje: combine um teste de contato e, se a reação foi forte, peça liberação médica.'],
 ['“Estou fazendo quimioterapia.”',2,'O tratamento enfraquece e derruba os fios, e a pele fica mais sensível. Espere o fim do tratamento e os fios voltarem a crescer.'],
 ['“Tenho mania de arrancar os cílios quando fico ansiosa.”',2,'Tricotilomania: a cliente tende a puxar as extensões e arrancar os fios naturais junto. Não é indicado aplicar.'],
 ['“Operei a vista a laser faz duas semanas.”',2,'Cirurgia ocular recente. Só com a liberação do oftalmologista.'],
 ['“Estou com a rinite atacada, o olho não para de lacrimejar e coçar.”',2,'Olho lacrimejando e coçando atrapalha a cura da cola e a cliente não consegue ficar parada. Remarque para quando a crise passar.'],
 ['“Quase não tenho cílios, caíram quase todos.”',2,'Sem fio natural saudável não há onde colar. Oriente a investigar a queda com um médico antes.'],
 ['“Estou com uma dermatite na pálpebra, está descamando.”',2,'Pele da pálpebra inflamada. O adesivo e os vapores podem piorar. Só com a pele recuperada.'],
 ['“Estou gripada, espirrando e tossindo o tempo todo.”',2,'Espirro e tosse com a pinça perto do olho são um risco, e há o contágio. Remarque.'],
 ['“Trato glaucoma com colírio todo dia.”',2,'Doença ocular em tratamento: só com a liberação do oftalmologista.'],
 ['“Uso lentes de contato, estou com elas agora.”',1,'Pode atender, mas peça para retirar as lentes antes. O olho fica fechado por muito tempo e os vapores irritam mais com a lente.'],
 ['“Vim direto do trabalho, estou de rímel e delineador.”',1,'Pode atender, mas remova toda a maquiagem e lave bem os cílios antes. Resíduo e oleosidade impedem a cola de fixar.'],
 ['“Tenho extensões de outro lugar, estão em bloquinhos e tortas.”',1,'Pode atender, mas remova o trabalho antigo com removedor próprio antes de aplicar um novo. Não cole por cima.'],
 ['“Estou grávida de cinco meses, tudo bem com a gestação.”',1,'Em geral pode, com cuidado extra: posição confortável, pausas e ambiente ventilado. Muitos studios pedem a liberação do obstetra.'],
 ['“Meus olhos são bem sensíveis, lacrimejam fácil, mas não tenho doença.”',1,'Pode atender com cuidado: adesivo para olhos sensíveis, boa ventilação e pads bem posicionados. Avise que pode parar se arder.'],
 ['“É minha primeira vez. Não uso lentes, não tenho alergia nem problema nos olhos.”',0,'Sem contraindicação. Explique o procedimento e os cuidados antes de começar.'],
 ['“Faço manutenção a cada três semanas e nunca tive reação.”',0,'Cliente de rotina, sem queixas. Pode seguir com a manutenção.'],
 ['“Não tenho nenhum problema de saúde, só quero um efeito mais natural.”',0,'Sem contraindicação. A dúvida é só de estilo: mostre o catálogo.'],
];
// [pergunta, resposta certa, erradas, explicação]
const PRODUTOS=[
 ['Para tirar a oleosidade dos fios naturais antes de colar, você usa:','Primer',['Óleo demaquilante','Removedor em gel','Hidratante facial'],'O primer desengordura o fio e melhora a fixação. Qualquer produto oleoso impede a cola de aderir.'],
 ['Para proteger e isolar os cílios inferiores, você usa:','Pad de gel e fita micropore',['Algodão seco','Fita crepe comum','Nada, a cliente só fecha os olhos'],'Pad e micropore são feitos para a pele sensível da região. Sem isolar, os fios de baixo grudam nos de cima.'],
 ['Para lavar os cílios antes do procedimento, você usa:','Shampoo próprio para cílios',['Demaquilante bifásico','Sabonete em barra','Álcool 70%'],'O shampoo de cílios limpa sem deixar óleo. Bifásico deixa resíduo oleoso, e álcool não vai perto dos olhos.'],
 ['Para colar a extensão no fio natural, você usa:','Adesivo próprio para extensão de cílios',['Cola de cílios postiços de tira','Supercola doméstica','Cola de unha postiça'],'Só o adesivo profissional para extensão é formulado para ficar perto dos olhos e durar semanas.'],
 ['Onde você pinga a gota de cola para trabalhar?','Na pedra de jade',['No dorso da mão','No papel toalha','Na tampa do frasco'],'A pedra de jade é fria e mantém a gota fresca por mais tempo. Papel absorve e a pele aquece a cola.'],
 ['Para retirar extensões, você usa:','Removedor próprio, em gel ou creme',['A pinça, puxando fio a fio','Acetona','Água quente'],'O removedor dissolve a cola sem arrancar o fio natural. Puxar arranca o fio e pode machucar a pálpebra.'],
 ['Para isolar um único fio natural na hora de colar, você usa:','A pinça de isolamento',['O dedo','Um cotonete','A escovinha'],'Cada extensão vai em um fio natural só. A pinça de isolamento separa esse fio dos vizinhos.'],
 ['Entre uma cliente e outra, as pinças devem ser:','Lavadas e desinfetadas ou esterilizadas',['Limpas com pano seco','Passadas no primer','Só enxaguadas na água'],'Pinça encosta perto do olho de cada cliente. Sem desinfecção, você leva infecção de uma para a outra.'],
 ['Para ajudar a cola a curar no fim da aplicação, você usa:','Ventilador de mão ou nano mister',['Secador quente','Óleo finalizador','Rímel transparente'],'Ar frio ou a névoa fina aceleram a cura e diminuem a ardência. Calor e óleo estragam a fixação.'],
 ['Para pentear os fios no fim, você usa:','Escovinha descartável',['Pente de cabelo','Os dedos','A própria pinça'],'Escovinha nova para cada cliente: alinha os fios sem puxar e sem contaminar.'],
];
// [pergunta, passos na ordem certa, explicação]
const ORDENS=[
 ['Coloque o atendimento na ordem certa.',['Fazer a anamnese','Higienizar mãos e materiais','Lavar e secar os cílios','Colocar pads e fita','Passar o primer','Aplicar as extensões','Separar os fios colados','Ventilar e remover os pads'],'Primeiro você decide se pode atender, depois limpa, isola, prepara, aplica, revisa e só então libera a cliente.'],
 ['Coloque a aplicação de um fio na ordem certa.',['Isolar um fio natural','Pegar a extensão do tamanho da zona','Molhar a base na cola','Colar a 0,5 a 1 mm da pálpebra','Conferir se não grudou no vizinho'],'O fio natural já deve estar isolado antes de a cola entrar em cena: ela começa a secar em segundos.'],
 ['Coloque a preparação do adesivo na ordem certa.',['Conferir a validade do frasco','Agitar bem o adesivo','Pingar a gota na pedra de jade','Trocar a gota quando engrossar'],'Adesivo vencido ou mal agitado segura menos. A gota engrossa em contato com o ar e precisa ser trocada.'],
];
const N_CASOS=8, N_PROD=5, N_ORD=2;

/* ===== jogo ===== */
const $=q=>document.querySelector(q), Q=$('#q'), A=$('#a'), M=$('#main');
const mix=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
let P=[], i=0;
function montar(){
  P=[...mix(CASOS).slice(0,N_CASOS).map(c=>({t:'caso',bloco:'Atender ou não?',q:c[0],ops:R,certa:R[c[1]],exp:c[2],r:null})),
     ...mix(PRODUTOS).slice(0,N_PROD).map(p=>({t:'prod',bloco:'Produto certo',q:p[0],ops:mix([p[1],...p[2]]),certa:p[1],exp:p[3],r:null})),
     ...mix(ORDENS).slice(0,N_ORD).map(o=>({t:'ord',bloco:'Ordem certa',q:o[0],ops:mix(o[1]),certa:o[1],exp:o[2],r:[]}))];
  i=0;
}
const respondida=p=>p.t==='ord'?p.r.length===p.certa.length:p.r!==null;
const acertou=p=>p.t==='ord'?p.r.join('|')===p.certa.join('|'):p.r===p.certa;
function barra(){$('#dots').innerHTML=P.map((p,k)=>`<i class="${k===i?'now':respondida(p)?'done':''}"></i>`).join('');$('#count').textContent=P.length?`${Math.min(i+1,P.length)} de ${P.length}`:''}
function inicio(){M.className='';P=[];barra();let rec='';try{const v=localStorage.getItem('lash-quiz-recorde');if(v)rec=`<p>Seu recorde: <b>${v}%</b></p>`}catch(e){}
  Q.innerHTML=`<div class="eye">Quiz de atendimento</div><h2>Você sabe quando <em>atender</em> e o que <em>usar?</em></h2><p>São ${N_CASOS+N_PROD+N_ORD} perguntas sorteadas a cada rodada.</p>${rec}`;
  A.innerHTML=`<p><b>1. Atender ou não?</b> A cliente conta uma situação e você decide.</p><p><b>2. Produto certo.</b> Qual produto usar em cada momento.</p><p><b>3. Ordem certa.</b> Monte a sequência dos passos.</p>
   <p>O jogo só mostra o que está certo ou errado <b>no fim</b>, com a explicação de cada resposta.</p><div class="nav"><button class="pri" id="go">Começar</button></div>
   <p style="font-size:12px">Material de treino. Não substitui curso, avaliação médica nem as regras do seu studio.</p>`;
  $('#go').onclick=()=>{montar();tela()}}
function tela(){M.className='';const p=P[i];barra();
  Q.innerHTML=`<div class="eye">${p.bloco}</div><h2>${p.t==='caso'?'A cliente conta:':p.q}</h2>${p.t==='caso'?`<p style="font-size:19px;color:var(--text)">${p.q}</p><p>O que você faz?</p>`:''}`;
  let h='';
  if(p.t==='ord') h=`<div class="seq" id="seq">${p.r.map((s,k)=>`<button class="on" data-s="${k}">${k+1}. ${s}</button>`).join('')}</div><div class="row">${p.ops.filter(s=>!p.r.includes(s)).map(s=>`<button data-o="${p.ops.indexOf(s)}">${s}</button>`).join('')}</div>${p.r.length?'<p style="font-size:13px">Toque num passo da lista para tirar.</p>':''}`;
  else h=p.ops.map((o,k)=>`<button class="${p.r===o?'on':''}" data-k="${k}">${o}</button>`).join('');
  const ult=i===P.length-1;
  A.innerHTML=h+`<div class="nav"><button id="back" ${i?'':'disabled'}>Voltar</button><button class="pri" id="next" ${respondida(p)?'':'disabled'}>${ult?'Terminar e ver o resultado':'Próxima'}</button></div>`;
  A.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{p.r=p.ops[b.dataset.k];tela()});
  A.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{p.r.push(p.ops[b.dataset.o]);tela()});
  A.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{p.r.splice(+b.dataset.s,1);tela()});
  $('#back').onclick=()=>{i--;tela()};
  $('#next').onclick=()=>{if(ult)resultado();else{i++;tela()}}}
function resultado(){M.className='full';i=P.length;barra();$('#count').textContent='Resultado';
  const ok=P.filter(acertou).length,pc=Math.round(ok/P.length*100);
  try{const v=+localStorage.getItem('lash-quiz-recorde')||0;if(pc>v)localStorage.setItem('lash-quiz-recorde',pc)}catch(e){}
  const blocos=['Atender ou não?','Produto certo','Ordem certa'].map(b=>{const g=P.filter(p=>p.bloco===b);return `${b}: <b>${g.filter(acertou).length} de ${g.length}</b>`}).join(' · ');
  const fmt=v=>Array.isArray(v)?v.map((s,k)=>`${k+1}. ${s}`).join(' → '):v;
  A.innerHTML=`<div class="row" style="align-items:flex-end;gap:16px"><div class="big">${pc}%</div><div style="flex:1;min-width:220px"><h2>${pc>=90?'Pronta para <em>atender</em>':pc>=70?'Quase <em>lá</em>':'Vale <em>revisar</em>'}</h2><p>${ok} de ${P.length} respostas certas. ${blocos}</p></div><button class="pri" id="again">Jogar de novo</button></div>
   <div class="cols">${P.map((p,k)=>{const c=acertou(p);return `<div class="res ${c?'ok':''}"><div class="st">${k+1} · ${c?'Certo':'Errado'} · ${p.bloco}</div><b>${p.q}</b>${c?'':`<span>Você respondeu: ${fmt(p.r)}</span>`}<span>Resposta certa: <b>${fmt(p.certa)}</b></span><span>${p.exp}</span></div>`}).join('')}</div>`;
  A.scrollTop=0;$('#again').onclick=inicio}
inicio();
</script>
</body>
</html>
