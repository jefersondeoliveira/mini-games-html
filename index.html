<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Games HTML</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;font-family:'Fredoka',system-ui,sans-serif;color:#4a2c5e;
    background:radial-gradient(circle,rgba(255,255,255,.7) 6px,transparent 7px) 0 0/44px 44px,linear-gradient(180deg,#d9f4ff,#ffe1f1);
    display:flex;flex-direction:column;align-items:center;padding:40px 16px;box-sizing:border-box}
  h1{font-size:44px;margin:0 0 6px;background:linear-gradient(90deg,#ff6fae,#ff9f43,#4fd9ad,#5cc8ff,#a879ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
  p{color:#7a5b8c;margin:0 0 30px;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;width:100%;max-width:900px}
  a.card{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:22px;padding:22px;border:4px solid #ead7f0;box-shadow:0 8px 0 #a879ff;transition:transform .15s}
  a.card:hover{transform:translateY(-4px)}
  .emoji{font-size:64px}
  .card h2{margin:8px 0 4px}
  .card span{color:#7a5b8c;font-size:15px}
</style>
</head>
<body>
  <h1>🎮 Mini Games HTML</h1>
  <p>Joguinhos feitos em HTML, direto no navegador.</p>
  <div class="grid">
    <a class="card" href="sorveteria/">
      <div class="emoji">🍦</div>
      <h2>Sorveteria Arco-Íris</h2>
      <span>Atenda no balcão, anote os pedidos e monte os sorvetes!</span>
    </a>
  </div>
</body>
</html>
